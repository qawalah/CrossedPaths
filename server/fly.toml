# fly.toml app configuration file generated for crossedpaths on 2026-11-01T15:00:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'crossedpaths'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADMIN_HANDLES = ''
  ALLOW_REGISTRATION = 'true'
  BLUR_M = '100'
  DATA_DIR = '/data'
  MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty'
  MAX_UPLOAD_MB = '80'
  PLACE_NAMES = 'true'
  RESULTS_TTL_DAYS = '14'
  ROADS_MAX_DOWNLOAD_MB = '1500'
  STREET_SNAP = 'true'
  UPLOAD_KEEP_MAX_DAYS = '0'
  UPLOAD_TTL_HOURS = '24'

[[mounts]]
  source = 'crosspaths_data'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/config'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
