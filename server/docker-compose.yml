# CrossPaths server for a NAS (Synology Container Manager) or any Intel/AMD machine with Docker.
#
# The image is built on GitHub (DevStore, .github/workflows/release.yml) for every new server
# version and published to ghcr.io/qawalah/crosspaths. Watchtower installs new versions by
# itself: see docs/nas-setup.md in DevStore (qawalah/devstore). The image is linux/amd64 only.
#
# Put this file and your .env in their own folder on the NAS, then:
#   Synology: Container Manager -> Project -> Create -> choose that folder
#   Command line: docker compose up -d
# To build from source instead, replace the image and pull_policy lines with `build: .`

services:
  crosspaths:
    image: ghcr.io/qawalah/crosspaths:latest   # to roll back, put the previous version here (e.g. :0.11.1)
    pull_policy: always
    container_name: crosspaths
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true   # Watchtower keeps this container on the newest version
    ports:
      - "8787:8787"
    environment:
      INVITE_CODE: ${INVITE_CODE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      UPLOAD_TTL_HOURS: ${UPLOAD_TTL_HOURS:-24}          # default for new accounts; each user can change theirs
      UPLOAD_KEEP_MAX_DAYS: ${UPLOAD_KEEP_MAX_DAYS:-0}   # longest a user may keep uploads (0 = no limit, "until I delete it" allowed)
      RESULTS_TTL_DAYS: ${RESULTS_TTL_DAYS:-14}
      BLUR_M: ${BLUR_M:-100}
      # Offline neighbourhood/city names for crossings. Downloads GeoNames place lists once
      # into ./data/places (world towns ~40 MB, plus one small file per country you cross in).
      PLACE_NAMES: ${PLACE_NAMES:-true}
    volumes:
      - ./data:/data   # database, encrypted uploads and keys.json: back it up, never delete it
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/config', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
