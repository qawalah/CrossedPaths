services:
  crosspaths:
    build: .
    container_name: crosspaths
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      INVITE_CODE: ${INVITE_CODE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      UPLOAD_TTL_HOURS: ${UPLOAD_TTL_HOURS:-24}          # default for new accounts; each user can change theirs
      UPLOAD_KEEP_MAX_DAYS: ${UPLOAD_KEEP_MAX_DAYS:-0}   # longest a user may keep uploads (0 = no limit, "until I delete it" allowed)
      RESULTS_TTL_DAYS: ${RESULTS_TTL_DAYS:-14}
      BLUR_M: ${BLUR_M:-100}
      # Offline neighbourhood/city names for crossings. Downloads GeoNames place lists once
      # into ./data/places (world towns ~40 MB, plus one small file per country you cross in).
      PLACE_NAMES: ${PLACE_NAMES:-true}
      # Usernames (comma-separated) who see the admin part of Settings (street maps).
      ADMIN_HANDLES: ${ADMIN_HANDLES:-}
      # Draw journeys along streets in countries an admin downloaded (into ./data/roads).
      STREET_SNAP: ${STREET_SNAP:-true}
      ROADS_MAX_DOWNLOAD_MB: ${ROADS_MAX_DOWNLOAD_MB:-1500}
    volumes:
      - ./data:/data
      # Code is bind-mounted read-only so most updates are copy-files-and-restart, no
      # rebuild needed. Rebuild (docker compose build) only when requirements.txt changes.
      - ./server:/app/server:ro
      - ./crosspaths:/app/crosspaths:ro
      - ./wsgi.py:/app/wsgi.py:ro
      - ./VERSION:/app/VERSION:ro
    # Preparing a street map needs 1-4 GB for a while (more for big countries); the app itself
    # stays well under 900 MB. Raise this if a map fails with "ran out of memory".
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/config', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
